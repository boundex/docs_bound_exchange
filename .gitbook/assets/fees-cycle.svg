<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Saira, 'Public Sans', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="85%" cy="0%" r="70%">
      <stop offset="0" stop-color="#3a5df6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3a5df6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2444"/>
      <stop offset="1" stop-color="#141a30"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7d95ff"/>
    </marker>
    <style>
      .h { font-size: 18px; font-weight: 700; fill: #eceefc; letter-spacing: .2px }
      .b { font-size: 13px; fill: rgba(236,238,252,0.78) }
      .d { font-size: 12px; fill: rgba(236,238,252,0.50) }
      .chip { font-size: 11px; font-weight: 700; letter-spacing: .8px }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff }
    </style>
  </defs>

  <rect width="1000" height="500" rx="20" fill="#090b12"/>
  <rect width="1000" height="500" rx="20" fill="url(#glow)"/>

  <!-- 1 Open -->
  <g transform="translate(32,150)">
    <rect width="240" height="200" rx="16" fill="url(#card)" stroke="rgba(236,238,252,0.10)"/>
    <circle cx="30" cy="32" r="13" fill="#3a5df6"/><text x="30" y="37" text-anchor="middle" class="num">1</text>
    <text x="52" y="38" class="h">Open</text>
    <rect x="20" y="58" width="112" height="22" rx="11" fill="rgba(58,93,246,0.18)" stroke="#3a5df6"/>
    <text x="76" y="73" text-anchor="middle" class="chip" fill="#7d95ff">UPFRONT FEE</text>
    <text x="20" y="108" class="b">1% protocol fee</text>
    <text x="20" y="130" class="b">+ Hyperliquid execution fee</text>
    <text x="20" y="150" class="d">(open + close of the hedge)</text>
    <line x1="20" y1="168" x2="220" y2="168" stroke="rgba(236,238,252,0.08)"/>
    <text x="20" y="188" class="d">Taken from your stake</text>
  </g>

  <path d="M272,250 L326,250" stroke="#7d95ff" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 2 Live -->
  <g transform="translate(334,150)">
    <rect width="250" height="200" rx="16" fill="url(#card)" stroke="rgba(236,238,252,0.10)"/>
    <circle cx="30" cy="32" r="13" fill="#3a5df6"/><text x="30" y="37" text-anchor="middle" class="num">2</text>
    <text x="52" y="38" class="h">Position live</text>
    <rect x="20" y="58" width="80" height="22" rx="11" fill="rgba(125,149,255,0.12)" stroke="#7d95ff"/>
    <text x="60" y="73" text-anchor="middle" class="chip" fill="#b3bef8">SPREAD</text>
    <text x="20" y="108" class="b">LP fee + skew</text>
    <text x="20" y="130" class="b">+ estimated funding</text>
    <text x="20" y="150" class="b">+ estimated slippage</text>
    <line x1="20" y1="168" x2="230" y2="168" stroke="rgba(236,238,252,0.08)"/>
    <text x="20" y="188" class="d">Built into the payoff multiple</text>
  </g>

  <!-- connectors -->
  <path d="M584,230 C620,230 610,92 650,92" stroke="#51b19d" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M584,250 L650,250" stroke="#7d95ff" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M584,270 C620,270 610,408 650,408" stroke="#df484c" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 3a Win -->
  <g transform="translate(658,30)">
    <rect width="310" height="124" rx="16" fill="url(#card)" stroke="rgba(81,177,157,0.45)"/>
    <rect x="0" y="16" width="4" height="92" rx="2" fill="#51b19d"/>
    <text x="22" y="36" class="h">Win</text>
    <text x="70" y="36" class="d">· target hit first</text>
    <text x="22" y="66" class="b">You receive the quoted payout</text>
    <text x="22" y="88" class="b">Spread already taken out</text>
    <text x="22" y="110" class="chip" fill="#7ecbb8">NO FURTHER FEES</text>
  </g>

  <!-- 3b Close early -->
  <g transform="translate(658,182)">
    <rect width="310" height="136" rx="16" fill="url(#card)" stroke="rgba(125,149,255,0.45)"/>
    <rect x="0" y="16" width="4" height="104" rx="2" fill="#3a5df6"/>
    <text x="22" y="36" class="h">Close early</text>
    <text x="22" y="64" class="chip" fill="#7ecbb8">IN PROFIT</text>
    <text x="104" y="64" class="b">Spread × (profit now ÷</text>
    <text x="104" y="82" class="b">profit at target) + 1% fee</text>
    <text x="22" y="108" class="chip" fill="#f2888b">AT A LOSS</text>
    <text x="104" y="108" class="b">1% fee only</text>
  </g>

  <!-- 3c Lose -->
  <g transform="translate(658,346)">
    <rect width="310" height="124" rx="16" fill="url(#card)" stroke="rgba(223,72,76,0.45)"/>
    <rect x="0" y="16" width="4" height="92" rx="2" fill="#df484c"/>
    <text x="22" y="36" class="h">Lose</text>
    <text x="76" y="36" class="d">· stop hit first</text>
    <text x="22" y="66" class="b">You receive $0</text>
    <text x="22" y="88" class="b">No Spread charged</text>
    <text x="22" y="110" class="chip" fill="#f2888b">NO FURTHER FEES</text>
  </g>

  <text x="32" y="420" class="d">Upfront Fee: paid on every position</text>
  <text x="32" y="442" class="d">Spread: only collected when you profit</text>
</svg>
